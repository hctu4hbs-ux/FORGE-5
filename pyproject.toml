[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge5-council"
version = "0.1.0"
description = "Evidence-driven engineering council for Python coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "FORGE-5 contributors"}]
keywords = ["agent-skills", "engineering", "code-review", "quality-gates", "multi-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.17,<1", "mypy>=2.4,<3", "coverage[toml]>=7.17,<8", "build>=1.6,<2", "bandit>=1.9,<2"]

[project.scripts]
forge5 = "forge5.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge5 = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/forge5"]

[tool.coverage.run]
source = ["forge5"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
