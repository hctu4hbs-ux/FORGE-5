name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python -m ruff format --check src tests scripts adapters
      - run: python -m ruff check src tests scripts adapters
      - run: python -m mypy src/forge5
      - run: python -m bandit -r src/forge5 -c pyproject.toml
      - name: Validate example behavior
        working-directory: examples/durableflow
        run: |
          python -m unittest discover -s tests -v
          python bench.py
      - run: python -m forge5 scan src
      - run: python -m build
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
